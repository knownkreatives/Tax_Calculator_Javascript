<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple tax calculator that helps you calculate the amount of tax you owe based on your income and tax rate.">
    <title>Tax Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container" id="main">
        <div class="" id="income_input">
            <p>Enter your income: </p><input name="income_inp" type="number" placeholder="..."/>
        </div>

        <div class="hidden" id="calculator_modes">
            <p>Select a calculator mode: </p>
            <ul class="" id="mode_list"></ul>
        </div>
        
        <div class="hidden" id="system_selector">
            <p>Select between the following: </p><input name="system_inp" type="number" placeholder="..."/>
            <ol class="" id="system_list"> </ol>
        </div>
        
        <div class="hidden" id="general_mode">

        </div>
        <div class="hidden" id="">
            <div class="hidden" id="bracket_selector">
                <p>Select between the following: </p><input name="system_inp" type="number" placeholder="..."/>
                <ol class="" id="system_list"></ol>
            </div>
        </div>
        <script src="script.js"></script>
    </div>
</body>

<footer>

</footer>
</html>
