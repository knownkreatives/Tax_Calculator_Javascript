<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple tax calculator that helps you calculate the amount of tax you owe based on your income and tax rate.">
    <title>Tax Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container" id="main">
        <div class="income-input" id="income_input">
            <p style="display: inline; margin-right: 10px;">Enter your income: </p><input name="income_inp" type="number" placeholder="..." style="display: inline;"/>
        </div>
        <br />

        <div class="selector" id="calculator_modes">
            <p style="display: inline; margin-right: 10px;">Select a calculator mode: </p><input name="mode_inp" type="number" placeholder="..."/>
            <ol class="option_list" id="mode_list"></ol>
        </div>
        <br />
              
        <div class="mode hidden" id="general_mode">
            <p style="display: inline; margin-right: 10px;">Enter percentage: </p><input name="percentage_inp" type="number" placeholder="..." />
            <p id="general_output"></p>
        </div>
        
        <div class="mode hidden" id="income_mode">
            <div class="selector" id="system_selector">
                <p style="display: inline; margin-right: 10px;">Select between the following: </p><input name="system_inp" type="number" placeholder="..."/>
                <ol class="option_list" id="system_list"></ol>
            </div>

            <div class="" id="income_brakdown">
                <table>
                    <thead>
                        <tr>
                            <th>Bracket</th>
                            <th>Taxable Income</th>
                            <th>Tax Rate</th>
                            <th>Tax Owed</th>
                        </tr>
                    </thead>
                    <tbody id="income_breakdown_table_body"></tbody>
                </table>
            </div>
            <br />
            <div class="" id="takehome_breakdown">
                <table>
                    <thead>
                        <tr>
                            <th>Time Period</th>
                            <th>Gross Income</th>
                            <th>Total Tax Owed</th>
                            <th>Net Income</th>
                        </tr>
                    </thead>
                    <tbody id="takehome_breakdown_table_body"></tbody>
                </table>
            </div>
        </div>
        <button type="button" id="solve_button" name="solve_btn" class="hidden"><p>Solve</p></button>
        <script src="script.js"></script>
    </div>
</body>

<footer></footer>
</html>
